<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>바둑 100 — 100단계로 배우는 바둑</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23e7bb74'/><circle cx='12' cy='12' r='6' fill='%23111'/><circle cx='21' cy='21' r='6' fill='%23fff' stroke='%23333'/></svg>">
<style>
:root {
  --bg: #14161c;
  --bg-soft: #1c1f27;
  --panel: #232733;
  --panel-2: #2b3040;
  --line: #363c4d;
  --ink: #e9ecf3;
  --ink-dim: #a3aabd;
  --ink-faint: #6f7791;
  --wood: #e7bb74;
  --accent: #6ea8fe;
  --good: #4ec988;
  --warn: #f0b45c;
  --bad: #ef6b6b;
  --gold: #ffce55;
  --radius: 14px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}

#app { min-height: 100vh; }

.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 64px; }
.wrap.wide { max-width: 1240px; }

/* ---------- 공통 요소 ---------- */

h1, h2, h3, h4 { line-height: 1.35; margin: 0 0 .5em; font-weight: 700; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.18rem; }
h3 { font-size: 1.02rem; }
p { margin: 0 0 .8em; }
strong { color: #fff; font-weight: 700; }
a { color: var(--accent); }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; }
.muted { color: var(--ink-dim); }
.faint { color: var(--ink-faint); font-size: .88rem; }
.center { text-align: center; }

.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  padding: 10px 16px;
  border-radius: 10px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover:not(:disabled) { background: #333a4d; border-color: #4a5268; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #0d1220; }
.btn-primary:hover:not(:disabled) { background: #8bbcff; border-color: #8bbcff; }
.btn-ghost { background: transparent; }
.btn-danger { background: transparent; border-color: #6d3a3a; color: #ffb1b1; }
.btn-sm { padding: 6px 11px; font-size: .88rem; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 14px;
}

.section { margin-bottom: 22px; }

.badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: .76rem;
  font-weight: 700;
  background: var(--panel-2);
  color: var(--ink-dim);
  border: 1px solid var(--line);
  vertical-align: middle;
}
.badge.rule { background: #2a3550; color: #a8c6ff; border-color: #3c4d75; }
.badge.shape { background: #2c3f36; color: #9fe0bd; border-color: #3f6152; }
.badge.tesuji { background: #43334c; color: #dcb4f2; border-color: #63487000; }
.badge.life { background: #4a3a2a; color: #f2cfa0; border-color: #6b543c; }
.badge.proverb { background: #4a3030; color: #f4b6b6; border-color: #6d4545; }
.badge.strategy { background: #2f3a4a; color: #b6cbe4; border-color: #45566d; }
.badge.exam { background: #55420f; color: var(--gold); border-color: #7a5f18; }
.badge.soon { background: #2a2d38; color: var(--ink-faint); }

.progress {
  position: relative;
  height: 18px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.progress-fill { height: 100%; background: linear-gradient(90deg, #4c7fd8, #6ea8fe); }
.progress-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .74rem; font-weight: 700; color: #fff;
}

.toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  padding: 10px 18px; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.45);
  animation: rise .22s ease-out;
}
.toast-good { border-color: #3d7a58; background: #1e3a2c; }
.toast-bad { border-color: #7a3d3d; background: #3a1e1e; }
.toast.out { opacity: 0; transition: opacity .35s; }
@keyframes rise { from { transform: translateY(10px); opacity: 0 } }

.modal-back {
  position: fixed; inset: 0; background: rgba(8,10,15,.7);
  display: flex; align-items: center; justify-content: center; z-index: 70; padding: 20px;
}
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; max-width: 480px; width: 100%; }

/* ---------- 메인 메뉴 ---------- */

.title-block { text-align: center; padding: 26px 0 14px; }
.title-block .logo {
  font-size: 2.6rem; font-weight: 800; letter-spacing: .22em;
  background: linear-gradient(180deg, #fff, var(--wood));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.title-block .tagline { color: var(--ink-dim); letter-spacing: .05em; }
.rule-line { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); margin: 12px 0 18px; }

.status-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.status-strip .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
.status-strip .k { font-size: .78rem; color: var(--ink-faint); }
.status-strip .v { font-size: 1.3rem; font-weight: 800; }
.status-strip .v small { font-size: .8rem; font-weight: 600; color: var(--ink-dim); }

.menu-list { display: grid; gap: 8px; }
.menu-item {
  display: flex; align-items: center; gap: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; cursor: pointer; text-align: left; width: 100%;
  color: var(--ink); font: inherit; transition: background .12s, border-color .12s;
}
.menu-item:hover { background: var(--panel-2); border-color: #4a5268; }
.menu-item .icon { font-size: 1.3rem; width: 1.6em; text-align: center; }
.menu-item .label { font-weight: 700; }
.menu-item .sub { font-size: .82rem; color: var(--ink-faint); }
.menu-item.primary { background: linear-gradient(90deg, #29406b, var(--panel)); border-color: #3f5f96; }

/* ---------- 상단 바 ---------- */

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  background: rgba(20,22,28,.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); padding: 10px 16px;
}
.topbar h1 { font-size: 1.02rem; margin: 0; }
.topbar .spacer { flex: 1; }

/* ---------- 바둑판 ---------- */

.board-wrap { display: flex; justify-content: center; }
canvas.board {
  width: 100%;
  max-width: min(78vh, 620px);
  aspect-ratio: 1 / 1;
  border-radius: 10px;
  box-shadow: 0 10px 40px rgba(0,0,0,.45);
  display: block;
  cursor: pointer;
  touch-action: manipulation;
}
canvas.board.locked { cursor: default; }

.play-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
@media (max-width: 900px) { .play-layout { grid-template-columns: 1fr; } }

.side { display: flex; flex-direction: column; gap: 12px; }

/* ---------- 스테이지 ---------- */

.chapter { margin-bottom: 24px; }
.chapter-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.chapter-head .n { color: var(--ink-faint); font-size: .82rem; }
.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.level-tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; cursor: pointer; text-align: left; color: var(--ink); font: inherit;
  transition: border-color .12s, background .12s;
}
.level-tile:hover:not(:disabled) { border-color: var(--accent); background: var(--panel-2); }
.level-tile:disabled { opacity: .42; cursor: not-allowed; }
.level-tile .n { font-size: .76rem; color: var(--ink-faint); font-weight: 700; }
.level-tile .t { font-weight: 700; }
.level-tile .stars { color: var(--gold); letter-spacing: .12em; font-size: .95rem; }
.level-tile.cleared { border-color: #3d6a4e; }
.level-tile.exam { background: linear-gradient(160deg, #3a2f12, var(--panel)); }

.stepbar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.step-chip {
  font-size: .78rem; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--ink-faint); background: var(--bg-soft);
}
.step-chip.done { color: var(--good); border-color: #3d6a4e; }
.step-chip.active { color: #fff; background: var(--accent); border-color: var(--accent); }

.formula-card { border-left: 3px solid var(--wood); }
.formula-card dt { font-weight: 700; color: var(--wood); margin-top: 10px; font-size: .9rem; }
.formula-card dd { margin: 2px 0 0; color: var(--ink); }

.feedback { border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line); background: var(--bg-soft); }
.feedback.good { border-color: #3d7a58; background: #1c3327; }
.feedback.bad { border-color: #7a4a3d; background: #33231c; }
.feedback.rule { border-color: #5a5a3d; background: #33321c; }
.feedback .head { font-weight: 700; margin-bottom: 4px; }

.quiz-option {
  display: block; width: 100%; text-align: left; margin-bottom: 8px;
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; color: var(--ink); font: inherit; cursor: pointer;
}
.quiz-option:hover:not(:disabled) { border-color: var(--accent); }
.quiz-option.correct { border-color: var(--good); background: #1e3a2c; }
.quiz-option.wrong { border-color: var(--bad); background: #3a1e1e; }
.quiz-option:disabled { cursor: default; }

/* ---------- 목록/도감 ---------- */

.list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.entry-tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  cursor: pointer; text-align: left; color: var(--ink); font: inherit;
}
.entry-tile:hover { border-color: var(--accent); }
.entry-tile .nm { font-weight: 700; }
.entry-tile.soon { opacity: .62; }

.term { border-bottom: 1px solid var(--line); padding: 10px 0; }
.term:last-child { border-bottom: none; }
.term .t { font-weight: 700; }

.movelist { max-height: 320px; overflow-y: auto; font-size: .9rem; }
.move-row {
  display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 8px; cursor: pointer;
}
.move-row:hover { background: var(--panel-2); }
.move-row.active { background: #2f3a54; }
.move-row .n { color: var(--ink-faint); width: 2.6em; text-align: right; }
.move-row .mk { width: 1.4em; text-align: center; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .93rem; }
.kv dt { color: var(--ink-dim); }
.kv dd { margin: 0; font-weight: 600; }

.slider-row { display: flex; align-items: center; gap: 12px; }
input[type="range"] { flex: 1; accent-color: var(--accent); }
select, input[type="text"], input[type="number"] {
  background: var(--bg-soft); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; font: inherit;
}
label.field { display: flex; flex-direction: column; gap: 5px; font-size: .86rem; color: var(--ink-dim); }
label.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }

.notice { border-left: 3px solid var(--warn); background: #2e2718; padding: 10px 14px; border-radius: 0 10px 10px 0; font-size: .9rem; }

.hint-choice { display: grid; gap: 8px; }
.hint-choice button { text-align: left; }

@media (max-width: 560px) {
  .status-strip { grid-template-columns: 1fr 1fr; }
  .wrap { padding: 14px 12px 56px; }
  .title-block .logo { font-size: 2rem; }
}

</style>
</head>

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(4)) {
    if (c == null || c === false) continue;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return node;
}

/**
 * 자식 노드를 교체한다.
 * replaceChildren에 null을 그냥 넘기면 화면에 "null" 글자가 찍히므로
 * 조건부 요소(`cond ? node : null`)를 안전하게 쓰기 위해 걸러 준다.
 */
function setChildren(node, ...children) {
  const list = children.flat(4)
    .filter((c) => c != null && c !== false)
    .map((c) => (typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c));
  node.replaceChildren(...list);
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
  return node;
}

/** **굵게** 와 줄바꿈만 지원하는 최소 마크업. 학습 문구에 강조를 넣기 위한 것이다. */
function rich(text) {
  const span = document.createElement('span');
  const escaped = String(text ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  span.innerHTML = escaped
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');

  function refresh() {
    view.setBoard(session.board).setView('auto');
    const last = session.moves[session.moves.length - 1];
    view.setLastMove(last ? last.idx : -1);
    view.render();
  }

  function onClick(idx) {
    if (session.solved) return;
    const res = session.play(idx);
    refresh();
    if (res.verdict === VERDICT.ILLEGAL) {
      feedback.className = 'feedback rule';
      setChildren(feedback, el('div', { class: 'head', text: '둘 수 없는 자리입니다' }), rich(res.message));
      return;
    }

      app.progress.recordProblem({ correct: true, firstTry });
      app.progress.recordReview(problem.id, firstTry);

        rich(problem.explanation || ''),
        el('div', { class: 'row', style: { marginTop: '10px' } }, button('완료', () => onSolved?.(), { variant: 'primary' })),
      );
      return;
    }
    if (res.verdict === VERDICT.CORRECT) {
      feedback.className = 'feedback good';
      setChildren(feedback, el('div', { class: 'head', text: res.message }));
      return;
    }
    firstTry = false;
    app.progress.recordProblem({ correct: false, firstTry: false });
    app.progress.recordReview(problem.id, false);
    feedback.className = 'feedback bad';
    setChildren(feedback, 
      el('div', { class: 'head', text: res.message }),
      res.detail ? rich(res.detail) : null,
      el('div', { class: 'row', style: { marginTop: '10px' } },
        button('한 수 물리기', () => { session.undo(); refresh(); }, { class: 'btn-sm' })),
    );
  }

  return el('div', { class: 'play-layout' },
    el('div', { class: 'board-wrap' }, canvas),
    el('div', { class: 'side' },
      card(
        el('h2', { text: problem.title || '문제' }),
        el('p', {}, rich(problem.prompt)),
        el('p', { class: 'faint', text: `${COLOR_NAME[session.userColor]} 차례입니다.` }),
      ),
      feedback,
      el('div', { class: 'row' },
        button('힌트', () => {
          const h = session.hint();
          feedback.className = 'feedback';
          setChildren(feedback, el('div', { class: 'head', text: `힌트 ${h.level}` }), rich(h.text));
        }),
        button('정답 보기', () => {
          const r = session.reveal();
          view.setMarkers(r.moves.map((l) => ({ at: fromLabel(l, size), type: 'highlight', fill: '#4ec988' })));
          view.render();
          feedback.className = 'feedback rule';
          setChildren(feedback, 
            el('div', { class: 'head', text: `정답: ${r.moves.join(' · ')}` }),
            rich(r.explanation),
            el('div', { class: 'row', style: { marginTop: '10px' } }, button('완료', () => onSolved?.())),
          );
        }, { variant: 'ghost' }),
        button('다시 풀기', () => { session.reset(); refresh(); feedback.className = 'feedback'; setChildren(feedback, rich(problem.prompt)); }, { variant: 'ghost' }),
      ),
    ),
  );
}

/**
 * 바둑 규칙 엔진 — 반면(盤面) 표현과 착수 규칙.
 *
 * PRIORITY 1. 이 파일은 UI/AI와 완전히 분리되어 있으며 node --test 로 단독 검증된다.
 * 좌표는 idx = y * size + x (x: 왼→오, y: 위→아래) 하나로 통일한다.
 */

const EMPTY = 0;
const BLACK = 1;
const WHITE = 2;

const COLOR_NAME = { [BLACK]: '흑', [WHITE]: '백' };

function opposite(color) {
  return color === BLACK ? WHITE : color === WHITE ? BLACK : EMPTY;
}

/** 바둑 관습상 I 열은 쓰지 않는다. */
const COLUMNS = 'ABCDEFGHJKLMNOPQRST';

const neighborCache = new Map();

/** size별 인접점 표를 한 번만 만들어 재사용한다(착수마다 재계산하지 않기 위함). */
function neighborTable(size) {
  const cached = neighborCache.get(size);
  if (cached) return cached;
  const table = new Array(size * size);
  for (let i = 0; i < size * size; i++) {
    const x = i % size;
    const y = (i / size) | 0;
    const list = [];
    if (y > 0) list.push(i - size);
    if (x > 0) list.push(i - 1);
    if (x < size - 1) list.push(i + 1);
    if (y < size - 1) list.push(i + size);
    table[i] = list;
  }
  neighborCache.set(size, table);
  return table;
}

const diagonalCache = new Map();

function diagonalTable(size) {
  const cached = diagonalCache.get(size);
  if (cached) return cached;
  const table = new Array(size * size);
  for (let i = 0; i < size * size; i++) {
    const x = i % size;
    const y = (i / size) | 0;
    const list = [];
    for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const nx = x + dx;
      const ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < size && ny < size) list.push(ny * size + nx);
    }
    table[i] = list;
  }
  diagonalCache.set(size, table);
  return table;
}

/** 재현 가능한 난수(고정 시드) — 조브리스트 해시가 실행마다 달라지면 기보 재생이 깨진다. */
function xorshift(seed) {
  let s = seed >>> 0 || 1;
  return () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s >>> 0;
  };
}

const zobristCache = new Map();

function zobristTable(size) {
  const cached = zobristCache.get(size);
  if (cached) return cached;

      table.b[c][i] = rng();
    }

  return table;

class Board {
  constructor(size = 19) {

    this.length = size * size;
    this.cells = new Int8Array(this.length);
    /** 단수패(單手劫) 금지점. 없으면 -1. */

    this._diag = diagonalTable(size);
    this._z = zobristTable(size);
    this._h1 = 0;
    this._h2 = 0;
    this._mark = new Int32Array(this.length);
    this._gen = 0;
    this._stack = new Int32Array(this.length);

    b._h2 = this._h2;

  /** 위치 해시(착수 순서와 무관, 반면만 반영) — 동형반복(수퍼코) 판정용. */

  /** 돌을 직접 놓거나 지운다. 규칙 검사를 하지 않는 저수준 연산. */

      this._h2 = (this._h2 ^ this._z.b[prev - 1][idx]) >>> 0;

      this._h2 = (this._h2 ^ this._z.b[color - 1][idx]) >>> 0;

  /**

    }

  /** 반면을 사람이 읽을 수 있는 형태로. 테스트 실패 메시지에서 유용하다. */

/* ------------------------------------------------------------------ *
 * 좌표 변환
 * ------------------------------------------------------------------ */

/** idx → 'D4' 형태의 표기. 세로는 아래에서 위로 1..size. */

  const x = idx % size;
  const y = (idx / size) | 0;
  return COLUMNS[x] + (size - y);
}

/** 'D4' → idx. 잘못된 표기는 -1. */
function fromLabel(label, size = 19) {
  if (typeof label !== 'string' || label.length < 2) return -1;
  const col = COLUMNS.indexOf(label[0].toUpperCase());
  const row = parseInt(label.slice(1), 10);
  if (col < 0 || col >= size || !Number.isFinite(row) || row < 1 || row > size) return -1;
  return (size - row) * size + col;
}

function labelsToIndices(labels, size = 19) {
  return (labels || []).map((l) => fromLabel(l, size)).filter((i) => i >= 0);
}

/**

 *   setup({ size:19, black:['D4'], white:['Q16'] })
 * 또는 귀·변 사활처럼 그림으로 적는 편이 편할 때:
 *   setup({ size:19, anchor:'A19', diagram:['XXO..', '.XO..'] })
 *   ('X' 흑, 'O' 백, '.' 빈점, ' '·'-' 무시)
 */

  const board = new Board(size);
  for (const l of spec.black || []) {
    const i = fromLabel(l, size);
    if (i >= 0) board.place(BLACK, i);
  }
  for (const l of spec.white || []) {
    const i = fromLabel(l, size);
    if (i >= 0) board.place(WHITE, i);

      // 위협의 크기(잡을 돌 수)를 minStones로 정한다.
      const targets = (goal.targets || []).map(idxOf);
      for (const t of targets) {
        if (board.cells[t] !== enemy) continue;
        const g = board.group(t);
        if (goal.minStones && g.stones.length < goal.minStones) continue;
        const r = canCapture(board, t, color, {
          maxDepth: goal.depth || 6, maxNodes: goal.maxNodes || 20000,
        });
        if (r.captured) return { achieved: true };
      }
      return { achieved: false, reason: 'no-threat' };
    }
    case 'reduce': {
      // "상대 활로를 실제로 줄였는가" — 먹여치기처럼 단수까지는 못 가지만
      // 활로를 하나씩 줄여 가는 수를 채점할 때 쓴다. initial 대비로 비교한다.
      const targets = (goal.targets || []).map(idxOf);
      for (const t of targets) {
        if (board.cells[t] === EMPTY) return { achieved: true };  // 아예 잡았다
        if (initial.cells[t] === EMPTY) continue;
        const before = initial.group(t).liberties.length;
        const now = board.group(t).liberties.length;
        if (now >= before) return { achieved: false, reason: 'not-reduced' };
      }
      return { achieved: true };
    }
    case 'capturable': {
      // "내 차례에 아직 잡을 수 있는가" — 상대 응수 뒤(=내 차례)에 쓰는 진행 조건.
      // 착수 직후(=상대 차례)에 쓰는 'capture'와 차례가 반대이므로 함수도 다르다.
      const targets = (goal.targets || []).map(idxOf);
      for (const t of targets) {
        if (board.cells[t] === EMPTY || board.cells[t] === color) continue;
        const r = canCapture(board, t, color, {
          maxDepth: goal.depth || 8, maxNodes: goal.maxNodes || 30000,
        });
        if (!r.captured) return { achieved: false, reason: 'escaped' };
      }
      return { achieved: true };
    }
    case 'ladder': {
      // 축이 아직 성립하는가. 잡는 쪽 차례일 때 판정해야 의미가 맞다.
      const t = idxOf(goal.target != null ? goal.target : (goal.targets || [])[0]);
      if (t < 0) return { achieved: false, reason: 'no-target' };
      if (board.cells[t] === EMPTY || board.cells[t] === color) return { achieved: true };
      return readLadder(board, t, color).captured
        ? { achieved: true }
        : { achieved: false, reason: 'ladder-broken' };
    }
    case 'liberties': {
      // "활로가 N개가 되는 곳에 두어라" — group을 적지 않으면 방금 둔 돌을 본다
      const g = goal.group != null ? idxOf(goal.group) : lastMoveOf(initial, board, color);
      if (g < 0 || board.cells[g] === EMPTY) return { achieved: false, reason: 'gone' };
      const n = board.libertyCount(g);
      if (goal.count != null && n !== goal.count) return { achieved: false, reason: 'liberties' };
      if (goal.min != null && n < goal.min) return { achieved: false, reason: 'liberties' };
      if (goal.max != null && n > goal.max) return { achieved: false, reason: 'liberties' };
      return { achieved: true };
    }
    case 'territory': {
      // "이 수로 집이 몇 집이 되었는가" — 포석·끝내기에서 크기를 실제로 세기 위한 목표.
      // score()가 "한 색으로만 둘러싸인 빈 점"을 집으로 센다. 봉쇄가 덜 되어 있으면
      // 그 빈 곳은 양쪽에 닿아 공배가 되므로 자동으로 0집이 된다 — 그것이 정확한 판정이다.
      const n = countTerritory(board, color, goal.box, size);
      if (goal.min != null && n < goal.min) return { achieved: false, reason: 'small' };
      if (goal.max != null && n > goal.max) return { achieved: false, reason: 'large' };
      return { achieved: true };
    }
    case 'point': {
      // 명시적으로 지정된 좋은 수들(모양 문제 등 엔진으로 판정하기 어려운 경우)
      const accept = (goal.accept || []).map(idxOf);
      const last = lastMoveOf(initial, board, color);
      return accept.includes(last) ? { achieved: true } : { achieved: false, reason: 'not-listed' };
    }
    default:
      return { achieved: false, reason: 'unknown-goal' };
  }
}

/** progressGoal이 어긋났을 때 쓸 짧은 오답 문구. */
function reason0(problem, before, after, move, color, size) {
  const r = explainWrong({ problem, before, after, move, color, size, goalResult: { achieved: false } });
  return r.headline;
}

function lastMoveOf(initial, board, color) {
  for (let i = 0; i < board.length; i++) {
    if (board.cells[i] === color && initial.cells[i] !== color) return i;
  }
  return -1;
}

/**
 * 한 수를 놓은 결과를 채점하고, 틀렸다면 그 이유를 반면에서 읽어 설명한다.
 */
function evaluateMove(ctx) {
  const { problem, before, after, move, color, size } = ctx;
  const label = toLabel(move, size);

  // 문제가 특정 수에 대해 직접 설명을 달아 두었으면 그것을 우선 보여 준다
  const authored = problem.comments && problem.comments[label];

  const goalResult = evaluateGoal(problem, before, after, color, size);
  if (goalResult.achieved) {
    const done = !problem.continueAfterGoal;
    return {
      verdict: VERDICT.CORRECT,
      message: authored || problem.successMessage || '정답입니다!',
      detail: problem.explanation,
      done,
    };
  }

  const reason = explainWrong({ problem, before, after, move, color, size, goalResult });
  return {
    verdict: VERDICT.WRONG,
    message: authored || reason.headline,
    detail: reason.detail,
  };
}

/**
 * 오답 설명 생성기.
 * 격언이 아니라 지금 반면에서 실제로 벌어지는 일을 근거로 말한다.
 */
function explainWrong(ctx) {
  const { problem, before, after, move, color, size, goalResult } = ctx;
  const enemy = opposite(color);
  const goal = problem.goal || {};
  const idxOf = (l) => (typeof l === 'number' ? l : fromLabel(l, size));
  const lab = (i) => toLabel(i, size);

  // 1) 내 돌이 스스로 위험해졌는가 — 어떤 문제에서든 가장 먼저 짚어야 할 사실
  if (after.cells[move] === color) {
    const g = after.group(move);
    if (g.liberties.length === 1) {
      return {
        headline: `이 수는 자충입니다. ${lab(move)}에 둔 돌이 활로 1개뿐인 단수가 됩니다.`,
        detail: `상대가 ${lab(g.liberties[0])}에 두면 ${g.stones.length}점이 그대로 잡힙니다.`,
      };
    }
  }

  switch (goal.type) {
    case 'capture': {
      const targets = (goal.targets || []).map(idxOf);
      for (const t of targets) {
        if (after.cells[t] === EMPTY || after.cells[t] === color) continue;
        const g = after.group(t);
        if (!g) continue;
        if (g.liberties.length === 1) {
          return {
            headline: `아직 잡지 못했습니다. ${COLOR_NAME[enemy]} 돌의 활로가 1개 남아 단수일 뿐입니다.`,
            detail: `상대는 ${lab(g.liberties[0])}로 달아납니다. 달아나도 소용없는 자리부터 막아야 합니다.`,
          };
        }
        const escape = canCapture(after, t, color, { maxDepth: 6, maxNodes: 20000 });
        return {
          headline: `아직 잡지 못했습니다. ${COLOR_NAME[enemy]} 돌의 활로가 ${g.liberties.length}개 남아 있습니다.`,
          detail: escape.captured
            ? '방향은 나쁘지 않지만 한 수로는 부족합니다. 더 확실하게 몰 수 있는 자리가 있습니다.'
            : `남은 활로는 ${g.liberties.slice(0, 4).map(lab).join('·')} 입니다. 이대로는 상대가 달아납니다.`,
        };
      }
      break;
    }
    case 'atari': {
      if (goalResult?.reason === 'not-filling') {
        return {
          headline: '상대 돌의 활로를 메우는 수가 아닙니다.',
          detail: '축은 매 수 상대의 활로를 하나씩 메워 단수를 유지해야 합니다. 다른 곳을 두면 상대가 달아납니다.',
        };
      }
      const targets = (goal.targets || []).map(idxOf);
      for (const t of targets) {
        if (after.cells[t] === EMPTY) continue;
        const g = after.group(t);
        return {
          headline: `단수가 되지 않았습니다. ${COLOR_NAME[enemy]} 돌의 활로가 ${g.liberties.length}개입니다.`,
          detail: '단수란 활로가 딱 1개 남은 상태입니다. 활로를 하나만 남기는 자리를 찾아보세요.',
        };
      }
      break;
    }
    case 'escape': {
      const g = idxOf(goal.group);
      if (goalResult?.reason === 'ko-only') {
        return {
          headline: '패로 버틸 수는 있지만 달아난 것은 아닙니다.',
          detail: '팻감 싸움에 지면 그대로 잡힙니다. 패에 기대지 않고 살아 나가는 길을 찾아보세요.',
        };
      }
      if (after.cells[g] !== color) {
        return { headline: '내 돌이 잡혔습니다.', detail: '달아나는 방향을 다시 생각해 봅시다.' };
      }
      const r = canCapture(after, g, enemy, { maxDepth: 8, maxNodes: 30000 });
      if (r.captured) {
        const ladder = readLadder(after, g, enemy);
        if (ladder.captured && ladder.sequence.length > 4) {
          return {
            headline: `달아나지 못했습니다. 상대가 ${lab(r.move)}부터 몰면 축으로 잡힙니다.`,
            detail: `축은 ${Math.ceil(ladder.sequence.length / 2)}수쯤 이어지지만 결국 귀에서 잡힙니다. 축으로 잡히는 방향으로는 달아날 수 없습니다.`,
          };
        }
        return {
          headline: `아직 안전하지 않습니다. 상대가 ${lab(r.move)}에 두면 잡힙니다.`,
          detail: '한 수 더 읽어 보세요. 두고 난 뒤 상대의 응수까지 확인하는 것이 수읽기입니다.',
        };
      }
      const libs = after.libertyCount(g);
      if (goal.minLiberties && libs < goal.minLiberties) {
        return {
          headline: `활로가 ${libs}개뿐입니다. ${goal.minLiberties}개 이상 확보해야 안심할 수 있습니다.`,
          detail: '활로가 적은 돌은 언제든 다시 공격받습니다.',
        };
      }
      break;
    }
    case 'connect': {
      const a = idxOf(goal.a);
      const b = idxOf(goal.b);
      const cut = findCut(after, a, b, color);
      if (cut >= 0) {
        return {
          headline: `아직 이어지지 않았습니다. 상대가 ${lab(cut)}에 두면 끊깁니다.`,
          detail: '끊긴 돌은 따로따로 약해집니다. 끊길 자리를 먼저 막아야 합니다.',
        };
      }
      break;
    }
    case 'cut': {
      const a = idxOf(goal.a);
      const b = idxOf(goal.b);
      const detail = goalResult?.reason === 'can-reconnect'
        ? `상대가 한 수만 두면 다시 이어집니다. 이을 자리 자체를 차지해야 끊은 것입니다.`
        : '두 돌이 아직 한 덩어리입니다.';
      return { headline: '아직 끊지 못했습니다.', detail };
    }
    case 'live': {
      const g = idxOf(goal.group);
      if (goalResult?.reason === 'ko-only') {
        return {
          headline: '패가 남습니다 — 아직 산 것이 아닙니다.',
          detail: '지금 모양은 팻감 싸움에 이겨야만 살 수 있습니다. 패 없이 확실하게 두 눈을 내는 자리를 찾아보세요.',
        };
      }
      if (after.cells[g] !== color) return { headline: '내 돌이 잡혔습니다.', detail: '' };
      const r = canCapture(after, g, enemy, { maxDepth: 10, maxNodes: 60000 });
      if (r.captured) {
        return {
          headline: `아직 살지 못했습니다. 상대가 ${lab(r.move)}에 두면 죽습니다.`,
          detail: '두 눈을 낼 수 있는 모양인지 확인해 보세요. 궁도를 넓히거나 급소를 먼저 차지해야 합니다.',
        };
      }
      break;
    }
    case 'kill': {
      const g = idxOf(goal.group);
      if (goalResult?.reason === 'ko-only-kill') {
        return {
          headline: '패로 몰았을 뿐, 아직 잡은 것이 아닙니다.',
          detail: '상대는 팻감을 써서 버틸 수 있습니다. 패 없이 확실하게 죽이는 급소가 따로 있습니다.',
        };
      }
      if (after.cells[g] === EMPTY) break;
      const grp = after.group(g);
      const eyes = eyeCount(after, grp);
      return {
        headline: eyes >= 2
          ? '상대가 두 눈을 내고 살았습니다.'
          : '이 수로는 잡히지 않습니다. 상대에게 살 여지가 남아 있습니다.',
        detail: '눈이 될 자리를 미리 없애는 급소가 있는지 찾아보세요.',
      };
    }
    case 'point': {
      // 포석·모양 문제처럼 엔진이 유일 정답을 계산할 수 없는 경우.
      // 그래도 "왜 아닌지"는 말해야 한다 — 문제에 적어 둔 기준을 그대로 돌려준다.
      const accept = (goal.accept || []).map(idxOf);
      return {
        headline: goal.reason || '이 문제에서 찾는 자리가 아닙니다.',
        detail: `이 국면에서 기준에 맞는 자리는 ${accept.length}곳입니다. 기준을 다시 읽고 세어 보세요.`,
      };
    }
    case 'territory': {
      const n = countTerritory(after, color, goal.box, size);
      const want = goal.min != null ? `${goal.min}집 이상` : `${goal.max}집 이하`;
      return {
        headline: `이 수로는 ${n}집입니다. 목표는 ${want}입니다.`,
        detail: n === 0
          ? '아직 한쪽이 트여 있어 집이 되지 않았습니다. 상대가 들어올 수 있는 자리를 막아야 집으로 굳어집니다.'
          : '막는 자리를 바꾸면 같은 한 수로 더 넓게 둘러쌀 수 있는지 확인해 보세요.',
      };
    }
    case 'liberties': {
      const g = goal.group != null ? idxOf(goal.group) : move;
      const n = after.cells[g] === EMPTY ? 0 : after.libertyCount(g);
      const want = goal.count != null
        ? `${goal.count}개`
        : goal.min != null && goal.max != null
          ? `${goal.min}~${goal.max}개`
          : goal.min != null ? `${goal.min}개 이상` : `${goal.max}개 이하`;
      return {
        headline: `이 자리에 두면 활로가 ${n}개입니다. 목표는 ${want}입니다.`,
        detail: '활로는 돌에 상하좌우로 바로 붙어 있는 빈 점입니다. 대각선은 활로가 아닙니다.',
      };
    }
    default:
      break;
  }

  // 목표별 설명이 없을 때의 마지막 안전망 — 그래도 반면의 사실로 말한다
  const generic = [];
  if (after.cells[move] === color) {
    const g = after.group(move);
    generic.push(`이 돌의 활로는 ${g.liberties.length}개입니다.`);
  }
  if (isSelfAtari(before, color, move)) generic.push('스스로 활로를 줄이는 수입니다.');
  return {
    headline: '목표를 이루지 못했습니다.',
    detail: generic.join(' ') || '두고 난 뒤 상대가 어디에 둘지 한 수만 더 읽어 보세요.',
  };
}

function findCut(board, a, b, color) {
  if (isConnected(board, a, b)) return -1;
  const enemy = opposite(color);
  const zone = neighborhood(board, [a, b], 2);
  for (const p of zone) {
    if (board.cells[p] !== EMPTY) continue;
    const probe = board.clone();
    if (!probe.play(enemy, p).ok) continue;
    if (!isSafelyConnected(probe, a, b, color)) return p;
  }
  return -1;
}

/* ------------------------------------------------------------------ *
 * 정답 탐색 / 상대의 저항
 * ------------------------------------------------------------------ */

/**
 * 목표를 달성하는 모든 착점을 찾는다.
 * 탐색 범위는 문제에 관련된 돌 주변으로 제한한다(19로 전체를 다 볼 필요가 없다).
 */
function findSolutions(problem, board, color, size = 19) {
  const goal = problem.goal || {};
  if (goal.type === 'point') {
    return (goal.accept || []).map((l) => (typeof l === 'number' ? l : fromLabel(l, size)));
  }
  const zone = solutionZone(problem, board, size);
  const enemy = opposite(color);
  const out = [];
  for (const p of zone) {
    if (board.cells[p] !== EMPTY) continue;
    const probe = board.clone();
    if (!probe.play(color, p).ok) continue;
    if (evaluateGoal(problem, board, probe, color, size).achieved) { out.push(p); continue; }

    // 축처럼 여러 수에 걸친 문제에서는 "아직 목표를 이루진 않았지만 올바른 첫 수"도 정답이다.
    // 채점기와 같은 기준(moveGoal + 응수 뒤 progressGoal)으로 판정한다.
    if (!problem.progressGoal) continue;
    if (problem.moveGoal) {
      const mv = evaluateGoal({ ...problem, goal: problem.moveGoal }, board, probe, color, size);
      if (!mv.achieved) continue;
    }
    const after = probe.clone();
    const reply = bestResistance(after, enemy, problem);
    if (reply != null && reply >= 0) after.play(enemy, reply);
    if (evaluateGoal({ ...problem, goal: problem.progressGoal }, board, after, color, size).achieved) out.push(p);
  }
  return out;
}

function solutionZone(problem, board, size) {
  const goal = problem.goal || {};
  const idxOf = (l) => (typeof l === 'number' ? l : fromLabel(l, size));

  // 집 목표는 "범위 안에서 어디에 두는가"를 묻는 문제다. 후보는 그 범위 안의 빈 점.
  if (goal.type === 'territory' && goal.box && goal.box.length === 2) {
    const a = idxOf(goal.box[0]); const b = idxOf(goal.box[1]);
    const x0 = Math.min(a % size, b % size); const x1 = Math.max(a % size, b % size);
    const y0 = Math.min((a / size) | 0, (b / size) | 0); const y1 = Math.max((a / size) | 0, (b / size) | 0);
    const zone = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) zone.push(y * size + x);
    return zone;
  }

  const anchors = [];
  for (const key of ['targets', 'group', 'a', 'b']) {
    const v = goal[key];
    if (Array.isArray(v)) anchors.push(...v.map(idxOf));
    else if (v != null) anchors.push(idxOf(v));
  }
  if (anchors.length === 0) {
    // 앵커가 없으면 반면의 돌 전체 주변을 본다
    for (let i = 0; i < board.length; i++) if (board.cells[i] !== EMPTY) anchors.push(i);
    // 빈 반면이면(LEVEL 1·2처럼 "아무 데나 두어 보세요") 반면 전체가 후보다
    if (anchors.length === 0) return Array.from({ length: board.length }, (_, i) => i);
  }
  // 사활 문제에서 무리가 완전히 둘러싸여 있으면 답은 궁도 안(또는 바로 옆)에 있다.
  // 큰 무리 주위를 반경 3으로 훑으면 후보가 수백 개가 되고, 그 하나하나를
  // 다시 사활 판정에 넣게 되어 힌트·정답 보기가 눈에 띄게 느려진다.
  if ((goal.type === 'live' || goal.type === 'kill') && anchors.length === 1 && !problem.searchRadius) {
    const region = eyeRegion(board, anchors[0]);

 * 한국·일본 규칙은 이 사정을 규정으로 못 박았다 — **귀곡사는 죽은 것으로 한다.**

    [[0, 0], [0, 1], [0, 2], [1, 0]].map(String).sort().join('|'),
    [[0, 0], [1, 0], [2, 0], [0, 1]].map(String).sort().join('|'),
  ];
  for (const [cx, cy, sx, sy] of corners) {
    const rel = pts.map(([x, y]) => [(x - cx) * sx, (y - cy) * sy]);

      // 둘 다 "팻감을 하나 쓰고 왔다"고 보고, 패를 이기는 쪽에게만 허락한다.
