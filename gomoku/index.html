<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오목 (Gomoku) — 흑 3-3 금수</title>
<style>
  :root{
    --bg: #1d1a16;
    --panel: #2a251f;
    --panel-2: #332c24;
    --text: #f2ece3;
    --muted: #b3a794;
    --accent: #e0b26a;
    --danger: #ff7b6b;
    --ok: #7fd39a;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(1200px 700px at 50% -10%, #2f2820 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 12px 28px;
    -webkit-text-size-adjust: 100%;
  }

  header{ text-align:center; margin-bottom: 10px; }
  h1{
    font-size: clamp(18px, 4.4vw, 24px);
    margin: 0 0 2px;
    letter-spacing: -0.02em;
  }
  .subtitle{ color: var(--muted); font-size: 12px; margin:0; }

  /* ── 상태 표시 ───────────────────────────── */
  .status-bar{
    width: 100%;
    max-width: 560px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--panel);
    border: 1px solid #3d352b;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .turn{ display:flex; align-items:center; gap:9px; font-weight:700; font-size: clamp(15px,3.6vw,17px); }
  .turn .dot{
    width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.45);
    flex: 0 0 auto;
  }
  .dot.black{ background: radial-gradient(circle at 34% 30%, #6d6d6d, #0b0b0b 70%); }
  .dot.white{ background: radial-gradient(circle at 34% 30%, #ffffff, #cdc7bd 75%); }
  .turn.win{ color: var(--accent); }
  .move-count{ color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .message{
    width: 100%;
    max-width: 560px;
    min-height: 22px;
    font-size: 13.5px;
    text-align: center;
    margin-bottom: 8px;
    color: var(--muted);
  }
  .message.error{ color: var(--danger); font-weight: 700; }
  .message.win{ color: var(--accent); font-weight: 700; font-size: 15px; }
  .message.shake{ animation: shake .32s; }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-5px); }
    75%{ transform: translateX(5px); }
  }

  /* ── 바둑판 ─────────────────────────────── */
  .board-wrap{
    padding: 14px;
    background: linear-gradient(160deg, #c8924a, #a9743a);
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .board{
    --cell: clamp(19px, min( (100vw - 60px) / 15, (100vh - 280px) / 15 ), 42px);
    position: relative;
    width: calc(var(--cell) * 15);
    height: calc(var(--cell) * 15);
    background:
      linear-gradient(140deg, rgba(255,255,255,.10), rgba(0,0,0,.06)),
      linear-gradient(0deg, #e3b978, #dcb069);
    border-radius: 4px;
    touch-action: manipulation;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .line{ position:absolute; background: #6b4a22; opacity:.85; }
  .line.h{ height:1px; left: calc(100% / 30); width: calc(100% - 100% / 15); }
  .line.v{ width:1px; top: calc(100% / 30); height: calc(100% - 100% / 15); }
  .star{
    position:absolute;
    width: calc(var(--cell) * 0.24); height: calc(var(--cell) * 0.24);
    background:#6b4a22; border-radius:50%;
    transform: translate(-50%, -50%);
  }

  .stone{
    position:absolute;
    width: calc(var(--cell) * 0.88);
    height: calc(var(--cell) * 0.88);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display:flex; align-items:center; justify-content:center;
    font-size: calc(var(--cell) * 0.36);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    animation: drop .13s ease-out;
    z-index: 2;
  }
  @keyframes drop{ from{ transform: translate(-50%,-50%) scale(.62); opacity:.4; } }
  .stone.black{
    background: radial-gradient(circle at 33% 28%, #7a7a7a, #111 62%, #000 100%);
    box-shadow: 0 2px 4px rgba(0,0,0,.5);
    color: #f0f0f0;
  }
  .stone.white{
    background: radial-gradient(circle at 33% 28%, #ffffff, #ddd7cd 70%, #bdb5a8 100%);
    box-shadow: 0 2px 4px rgba(0,0,0,.4);
    color: #333;
  }
  .stone .num{ opacity:.85; pointer-events:none; }
  body:not(.show-numbers) .stone .num{ display:none; }

  /* 최근 착수 표시 */
  .stone.last::after{
    content:"";
    position:absolute;
    width: calc(var(--cell) * 0.26);
    height: calc(var(--cell) * 0.26);
    border-radius: 50%;
    background: #ff5a4d;
    box-shadow: 0 0 0 1px rgba(0,0,0,.35);
  }
  body.show-numbers .stone.last::after{
    width: calc(var(--cell) * 0.86);
    height: calc(var(--cell) * 0.86);
    background: transparent;
    border: 2px solid #ff5a4d;
    box-shadow: none;
  }

  /* 승리한 5목 강조 */
  .stone.win{ z-index:3; animation: winpulse 1s ease-in-out infinite; }
  @keyframes winpulse{
    0%,100%{ box-shadow: 0 0 0 2px #ffd479, 0 0 10px 2px rgba(255,196,80,.75); }
    50%    { box-shadow: 0 0 0 3px #ffe9b5, 0 0 20px 7px rgba(255,196,80,.55); }
  }

  /* 금수 클릭 시 표시 */
  .forbidden-mark{
    position:absolute;
    width: calc(var(--cell) * 0.7); height: calc(var(--cell) * 0.7);
    transform: translate(-50%,-50%);
    z-index: 4;
    pointer-events:none;
    animation: fadeout 1.1s forwards;
  }
  .forbidden-mark::before, .forbidden-mark::after{
    content:""; position:absolute; top:50%; left:0;
    width:100%; height: 3px; margin-top:-1.5px;
    background:#e33b2b; border-radius:2px;
  }
  .forbidden-mark::before{ transform: rotate(45deg); }
  .forbidden-mark::after{ transform: rotate(-45deg); }
  @keyframes fadeout{ 0%{opacity:1;} 70%{opacity:1;} 100%{opacity:0;} }

  /* ── 컨트롤 ─────────────────────────────── */
  .controls{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin-top: 14px; width:100%; max-width: 560px;
  }
  button{
    font: inherit;
    font-weight: 600;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid #4a4034;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    transition: background .12s, transform .06s;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover:not(:disabled){ background: #40372c; }
  button:active:not(:disabled){ transform: translateY(1px); }
  button:disabled{ opacity:.42; cursor: not-allowed; }
  button.primary{ background: var(--accent); color:#241b0d; border-color:#c9985a; }
  button.primary:hover:not(:disabled){ background:#ecc07c; }

  .toggle{
    display:flex; align-items:center; gap:7px;
    color: var(--muted); font-size: 13px; cursor:pointer;
    padding: 10px 4px;
  }
  .toggle input{ width:16px; height:16px; accent-color: var(--accent); }

  /* ── 테스트 패널 ────────────────────────── */
  details.tests{
    width:100%; max-width: 560px; margin-top: 16px;
    background: var(--panel); border:1px solid #3d352b; border-radius: 12px;
    padding: 10px 14px; font-size: 13px;
  }
  details.tests summary{ cursor:pointer; color: var(--muted); font-weight:600; }
  #testOutput{
    margin: 10px 0 2px; white-space: pre-wrap; line-height:1.55;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; max-height: 320px; overflow:auto;
  }
  /* ── 좁은 화면: 판을 최대한 크게 ───────────── */
  @media (max-width: 480px){
    body{ padding: 10px 6px 24px; }
    .board-wrap{ padding: 9px; }
    .board{ --cell: clamp(19px, min( (100vw - 36px) / 15, (100vh - 250px) / 15 ), 42px); }
    .controls{ margin-top: 12px; }
  }

  .pass{ color: var(--ok); }
  .fail{ color: var(--danger); font-weight:700; }
  .rules{ color: var(--muted); font-size: 12.5px; line-height:1.7; margin-top:10px; }
  .rules b{ color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>오목 · Gomoku</h1>
  <p class="subtitle">15×15 · 흑 선공 · 흑돌 3-3 금수 적용</p>
</header>

<div class="status-bar">
  <div class="turn" id="turnIndicator">
    <span class="dot black" id="turnDot"></span>
    <span id="turnText">흑 차례</span>
  </div>
  <div class="move-count" id="moveCount">0 수</div>
</div>

<div class="message" id="message">가로·세로·대각선으로 5개를 먼저 만들면 승리합니다.</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<div class="controls">
  <button class="primary" id="btnReset">새 게임</button>
  <button id="btnUndo">무르기</button>
  <label class="toggle"><input type="checkbox" id="chkNumbers"> 착수 번호 표시</label>
</div>

<details class="tests">
  <summary>3-3 금수 판정 자체 검증 (테스트 실행)</summary>
  <button id="btnTest" style="margin-top:10px">테스트 실행</button>
  <div id="testOutput"></div>
  <div class="rules">
    <b>열린 3(Open Three)</b> — 한 수를 더 두어 <b>양쪽이 모두 열린 4</b>를 만들 수 있는 3.<br>
    <b>3-3 금수</b> — 흑의 한 수가 서로 다른 두 방향 이상에서 동시에 열린 3을 만들면 금수.<br>
    단, 그 수로 5목이 완성되면 승리가 우선하므로 금수가 아닙니다. 백에는 적용하지 않습니다.
  </div>
</details>

<!-- ══════════════════════════════════════════════════════════════
     순수 로직 (DOM 의존 없음) — 단위 테스트 가능
     ══════════════════════════════════════════════════════════════ -->
<script id="gomoku-core">
'use strict';

const SIZE  = 15;
const EMPTY = 0;
const BLACK = 1;
const WHITE = 2;

/** 가로, 세로, ↘ 대각선, ↗ 대각선 */
const DIRECTIONS = [[0, 1], [1, 0], [1, 1], [1, -1]];

function createBoard() {
  return Array.from({ length: SIZE }, () => new Array(SIZE).fill(EMPTY));
}

function inBounds(r, c) {
  return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
}

/**
 * (r,c)를 포함해 (dr,dc) 방향으로 이어진 같은 색 돌의 연속 구간 정보.
 * 문자열 패턴 비교가 아니라 실제 보드 상태를 양방향으로 훑어서 계산한다.
 *   cells  : 연속 구간 좌표 목록(방향순 정렬)
 *   before : 구간 앞쪽 바로 옆 칸 (empty: 비어 있는지)
 *   after  : 구간 뒤쪽 바로 옆 칸
 */
function lineRun(board, r, c, dr, dc) {
  const color = board[r][c];
  const cells = [[r, c]];

  let br = r - dr, bc = c - dc;
  while (inBounds(br, bc) && board[br][bc] === color) {
    cells.unshift([br, bc]);
    br -= dr; bc -= dc;
  }
  let ar = r + dr, ac = c + dc;
  while (inBounds(ar, ac) && board[ar][ac] === color) {
    cells.push([ar, ac]);
    ar += dr; ac += dc;
  }

  return {
    cells,
    length: cells.length,
    before: { r: br, c: bc, empty: inBounds(br, bc) && board[br][bc] === EMPTY },
    after:  { r: ar, c: ac, empty: inBounds(ar, ac) && board[ar][ac] === EMPTY },
  };
}

/**
 * 승리 판정. (r,c)에 놓인 돌 기준으로 4방향을 검사해
 * 5개 이상 연속이면 { color, cells }, 아니면 null.
 */
function checkWin(board, r, c) {
  const color = board[r][c];
  if (color === EMPTY) return null;

  for (const [dr, dc] of DIRECTIONS) {
    const run = lineRun(board, r, c, dr, dc);
    if (run.length >= 5) return { color, cells: run.cells };
  }
  return null;
}

/**
 * (r,c)에 color 돌이 이미 놓여 있다고 가정하고,
 * 그 돌을 포함한 (dr,dc) 방향 형태가 '열린 4'(양쪽이 뚫린 정확히 4연속)인지 판정.
 */
function isOpenFour(board, r, c, dr, dc) {
  const run = lineRun(board, r, c, dr, dc);
  return run.length === 4 && run.before.empty && run.after.empty;
}

/**
 * 열린 3 판정.
 * (r,c)에 color 돌이 이미 놓인 상태에서, 같은 라인의 빈 칸 한 곳에
 * 돌을 하나 더 놓아 '열린 4'를 만들 수 있으면 열린 3이다.
 *
 * 이 정의를 쓰면 ●●● 같은 붙은 형태뿐 아니라 ●●_● / ●_●● 같은 띈 3도
 * 자동으로 포함되고, 한쪽이 막혀 열린 4를 만들 수 없는 형태(예: X_●●●_X)는
 * 자동으로 제외된다. 별도의 문자열 패턴 목록이 필요 없다.
 */
function isOpenThree(board, r, c, dir, color) {
  const [dr, dc] = dir;

  // 같은 라인에서 (r,c) 주변 ±4칸의 빈 칸을 후보로 시험한다.
  for (let i = -4; i <= 4; i++) {
    if (i === 0) continue;
    const qr = r + dr * i, qc = c + dc * i;
    if (!inBounds(qr, qc) || board[qr][qc] !== EMPTY) continue;

    board[qr][qc] = color;                            // 가정 착수
    const run = lineRun(board, r, c, dr, dc);
    const makesOpenFour =
      run.length === 4 &&
      run.before.empty && run.after.empty &&
      run.cells.some(([a, b]) => a === qr && b === qc); // 새 돌이 그 4에 포함될 것
    board[qr][qc] = EMPTY;                            // 원복

    if (makesOpenFour) return true;
  }
  return false;
}

/**
 * 흑 3-3 금수 판정.
 * (r,c)에 흑을 놓았을 때 서로 다른 두 방향 이상에서 동시에 열린 3이 생기면 금수.
 * 단, 그 수로 5목이 완성되면 승리가 우선하므로 금수가 아니다.
 */
function isDoubleThree(board, r, c) {
  if (!inBounds(r, c) || board[r][c] !== EMPTY) return false;

  board[r][c] = BLACK;                                // 가정 착수
  let forbidden = false;

  if (!checkWin(board, r, c)) {
    let openThrees = 0;
    for (const dir of DIRECTIONS) {
      if (isOpenThree(board, r, c, dir, BLACK)) openThrees++;
    }
    forbidden = openThrees >= 2;
  }

  board[r][c] = EMPTY;                                // 원복
  return forbidden;
}

/** 금수 여부 — 백돌에는 적용하지 않는다. */
function isForbidden(board, r, c, color) {
  return color === BLACK && isDoubleThree(board, r, c);
}

/* ── 테스트용 헬퍼 ─────────────────────────────
   '.' 빈칸 / 'X' 흑 / 'O' 백  — 15자 × 15줄 */
function boardFromStrings(rows) {
  const board = createBoard();
  for (let r = 0; r < SIZE; r++) {
    const line = rows[r] || '';
    for (let c = 0; c < SIZE; c++) {
      const ch = line[c] || '.';
      board[r][c] = ch === 'X' ? BLACK : ch === 'O' ? WHITE : EMPTY;
    }
  }
  return board;
}

/** 좌표 목록으로 보드 생성: makeBoard([[r, c, color], ...]) */
function makeBoard(stones) {
  const board = createBoard();
  for (const [r, c, color] of stones) board[r][c] = color;
  return board;
}

/* ── 자체 검증 테스트 ──────────────────────── */
function runSelfTests() {
  const results = [];
  const check = (name, actual, expected) =>
    results.push({ name, pass: actual === expected, actual, expected });

  // 1. 가로 + 세로 열린 3 → 금수
  //    가로 (7,5)(7,6) / 세로 (5,7)(6,7) → (7,7) 착수
  check('1. 가로 + 세로 열린 3 → 금수',
    isDoubleThree(makeBoard([
      [7, 5, BLACK], [7, 6, BLACK],
      [5, 7, BLACK], [6, 7, BLACK],
    ]), 7, 7), true);

  // 2. 가로 + ↘대각선 열린 3 → 금수
  check('2. 가로 + 대각선 열린 3 → 금수',
    isDoubleThree(makeBoard([
      [7, 5, BLACK], [7, 6, BLACK],
      [5, 5, BLACK], [6, 6, BLACK],
    ]), 7, 7), true);

  // 3. 서로 다른 두 대각선 열린 3 → 금수
  check('3. 두 대각선 열린 3 → 금수',
    isDoubleThree(makeBoard([
      [5, 5, BLACK], [6, 6, BLACK],   // ↘
      [5, 9, BLACK], [6, 8, BLACK],   // ↗
    ]), 7, 7), true);

  // 4. 열린 3이 하나뿐 → 정상 착수
  check('4. 열린 3 하나뿐 → 착수 가능',
    isDoubleThree(makeBoard([
      [7, 5, BLACK], [7, 6, BLACK],
    ]), 7, 7), false);

  // 5. 한쪽이 백에 막혀 실제 열린 3이 아님 → 정상 착수
  //    가로는 (7,4)가 백이라 열린 4를 만들 수 없음 → 열린 3은 세로 하나뿐
  check('5. 한쪽이 막힌 3 + 열린 3 → 착수 가능',
    isDoubleThree(makeBoard([
      [7, 4, WHITE], [7, 5, BLACK], [7, 6, BLACK],
      [5, 7, BLACK], [6, 7, BLACK],
    ]), 7, 7), false);

  // 6. 백이 같은 형태 → 금수 아님
  check('6. 백의 3-3 → 착수 가능 (백 미적용)',
    isForbidden(makeBoard([
      [7, 5, WHITE], [7, 6, WHITE],
      [5, 7, WHITE], [6, 7, WHITE],
    ]), 7, 7, WHITE), false);
  check('6-b. 같은 형태를 흑이 만들면 금수',
    isForbidden(makeBoard([
      [7, 5, BLACK], [7, 6, BLACK],
      [5, 7, BLACK], [6, 7, BLACK],
    ]), 7, 7, BLACK), true);

  // 7. 띈 3(●●_●) + 세로 열린 3 → 금수
  //    가로 (7,5)(7,7)에 (7,8) 착수 → (7,6)에 두면 5~8 열린 4
  check('7. 한 칸 띈 3 + 열린 3 → 금수',
    isDoubleThree(makeBoard([
      [7, 5, BLACK], [7, 7, BLACK],
      [5, 8, BLACK], [6, 8, BLACK],
    ]), 7, 8), true);

  // 8. 양끝이 막혀 열린 4를 만들 수 없는 가짜 3 → 금수 아님
  check('8. 가짜 열린 3(양끝 막힘) + 열린 3 → 착수 가능',
    isDoubleThree(makeBoard([
      [7, 4, WHITE], [7, 9, WHITE],
      [7, 6, BLACK], [7, 8, BLACK],
      [5, 7, BLACK], [6, 7, BLACK],
    ]), 7, 7), false);

  // 9. 4를 만드는 방향은 3으로 세지 않는다 (4-3 허용)
  check('9. 4 + 열린 3 → 착수 가능',
    isDoubleThree(makeBoard([
      [7, 4, BLACK], [7, 5, BLACK], [7, 6, BLACK],   // 가로: 놓으면 4
      [5, 7, BLACK], [6, 7, BLACK],                  // 세로 열린 3
    ]), 7, 7), false);

  // 10. 그 수로 5목이 완성되면 금수가 아니다
  check('10. 5목 완성 수 → 금수 아님',
    isDoubleThree(makeBoard([
      [7, 3, BLACK], [7, 4, BLACK], [7, 5, BLACK], [7, 6, BLACK],
      [5, 7, BLACK], [6, 7, BLACK],
    ]), 7, 7), false);

  // 11. 판 가장자리: 벽에 막힌 3은 열린 3이 아니다
  check('11. 벽에 막힌 3 + 열린 3 → 착수 가능',
    isDoubleThree(makeBoard([
      [0, 1, BLACK], [0, 2, BLACK],   // 가로: 0행, 왼쪽 여유가 (0,0) 하나뿐 → 열린 4 불가
      [1, 3, BLACK], [2, 3, BLACK],   // 세로 열린 3
    ]), 0, 3), false);

  // 12. 승리 판정 — 가로 5목
  const winBoard = boardFromStrings([
    '...............',
    '...............',
    '...............',
    '...............',
    '...............',
    '...............',
    '...............',
    '....XXXXX......',
    '...............',
    '...............',
    '...............',
    '...............',
    '...............',
    '...............',
    '...............',
  ]);
  const win = checkWin(winBoard, 7, 6);
  check('12. 가로 5목 승리 판정',
    win !== null && win.cells.length === 5 && win.color === BLACK, true);

  // 13. 4목은 승리가 아니다
  check('13. 4목은 승리 아님',
    checkWin(makeBoard([
      [7, 4, BLACK], [7, 5, BLACK], [7, 6, BLACK], [7, 7, BLACK],
    ]), 7, 7), null);

  // 14. 대각선 5목 승리
  check('14. 대각선 5목 승리 판정',
    checkWin(makeBoard([
      [3, 3, WHITE], [4, 4, WHITE], [5, 5, WHITE], [6, 6, WHITE], [7, 7, WHITE],
    ]), 5, 5) !== null, true);

  return results;
}

/* Node 등에서 단위 테스트로 불러 쓸 수 있게 내보내기 (브라우저에서는 무시됨) */
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    SIZE, EMPTY, BLACK, WHITE, DIRECTIONS,
    createBoard, inBounds, lineRun, checkWin,
    isOpenFour, isOpenThree, isDoubleThree, isForbidden,
    boardFromStrings, makeBoard, runSelfTests,
  };
}
</script>

<!-- ══════════════════════════════════════════════════════════════
     UI / 게임 진행
     ══════════════════════════════════════════════════════════════ -->
<script>
'use strict';

const boardEl     = document.getElementById('board');
const turnTextEl  = document.getElementById('turnText');
const turnDotEl   = document.getElementById('turnDot');
const turnWrapEl  = document.getElementById('turnIndicator');
const messageEl   = document.getElementById('message');
const moveCountEl = document.getElementById('moveCount');
const btnUndo     = document.getElementById('btnUndo');

/* ── 게임 상태 ─────────────────────────────── */
let board;                    // 15×15 배열
let current;                  // 현재 차례
let history;                  // 착수 순서 기록: [{ r, c, color, index }]
let gameOver;
let winInfo;                  // { color, cells } | null
const stoneEls = new Map();   // "r,c" → 돌 DOM 요소

/* ── 판 그리기 ─────────────────────────────── */
const pos = i => `calc(${(i + 0.5)} * 100% / 15)`;

function drawGrid() {
  const frag = document.createDocumentFragment();

  for (let i = 0; i < SIZE; i++) {
    const h = document.createElement('div');
    h.className = 'line h';
    h.style.top = pos(i);
    frag.appendChild(h);

    const v = document.createElement('div');
    v.className = 'line v';
    v.style.left = pos(i);
    frag.appendChild(v);
  }

  for (const [r, c] of [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]]) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.top = pos(r);
    s.style.left = pos(c);
    frag.appendChild(s);
  }
  boardEl.appendChild(frag);
}

function renderStone(move, isLast) {
  const el = document.createElement('div');
  el.className = 'stone ' + (move.color === BLACK ? 'black' : 'white') + (isLast ? ' last' : '');
  el.style.top  = pos(move.r);
  el.style.left = pos(move.c);
  el.innerHTML = `<span class="num">${move.index}</span>`;
  boardEl.appendChild(el);
  stoneEls.set(move.r + ',' + move.c, el);
}

function updateLastMarker() {
  document.querySelectorAll('.stone.last').forEach(el => el.classList.remove('last'));
  const last = history[history.length - 1];
  if (last) {
    const el = stoneEls.get(last.r + ',' + last.c);
    if (el) el.classList.add('last');
  }
}

function highlightWin(cells) {
  for (const [r, c] of cells) {
    const el = stoneEls.get(r + ',' + c);
    if (el) el.classList.add('win');
  }
}

function showForbiddenMark(r, c) {
  const mark = document.createElement('div');
  mark.className = 'forbidden-mark';
  mark.style.top  = pos(r);
  mark.style.left = pos(c);
  boardEl.appendChild(mark);
  setTimeout(() => mark.remove(), 1100);
}

/* ── 상태 표시 ─────────────────────────────── */
function setMessage(text, kind) {
  messageEl.textContent = text;
  messageEl.className = 'message' + (kind ? ' ' + kind : '');
  if (kind === 'error') {
    messageEl.classList.remove('shake');
    void messageEl.offsetWidth;              // 애니메이션 재시작
    messageEl.classList.add('shake');
  }
}

function updateStatus() {
  moveCountEl.textContent = history.length + ' 수';
  btnUndo.disabled = history.length === 0;

  if (gameOver && winInfo) {
    turnDotEl.className = 'dot ' + (winInfo.color === BLACK ? 'black' : 'white');
    turnTextEl.textContent = (winInfo.color === BLACK ? '흑' : '백') + ' 승리';
    turnWrapEl.classList.add('win');
  } else if (gameOver) {
    turnTextEl.textContent = '무승부';
    turnWrapEl.classList.add('win');
  } else {
    turnDotEl.className = 'dot ' + (current === BLACK ? 'black' : 'white');
    turnTextEl.textContent = current === BLACK ? '흑 차례' : '백 차례';
    turnWrapEl.classList.remove('win');
  }
}

/* ── 게임 진행 ─────────────────────────────── */

/** 착수 처리. 성공하면 true, 실패(금수·중복·종료)하면 false. */
function placeStone(r, c) {
  if (gameOver) {
    setMessage('게임이 끝났습니다. 「새 게임」을 눌러 다시 시작하세요.', 'error');
    return false;
  }
  if (!inBounds(r, c)) return false;

  if (board[r][c] !== EMPTY) {
    setMessage('이미 돌이 놓인 자리입니다.', 'error');
    return false;
  }

  // 흑돌 3-3 금수
  if (isForbidden(board, r, c, current)) {
    showForbiddenMark(r, c);
    setMessage('3-3 금수입니다.', 'error');
    return false;
  }

  board[r][c] = current;
  const move = { r, c, color: current, index: history.length + 1 };
  history.push(move);
  renderStone(move, true);
  updateLastMarker();

  const win = checkWin(board, r, c);
  if (win) {
    gameOver = true;
    winInfo = win;
    highlightWin(win.cells);
    setMessage((win.color === BLACK ? '흑' : '백') + ' 승리! 🎉', 'win');
  } else if (history.length === SIZE * SIZE) {
    gameOver = true;
    winInfo = null;
    setMessage('무승부입니다.', 'win');
  } else {
    current = current === BLACK ? WHITE : BLACK;
    setMessage(current === BLACK ? '흑 차례입니다.' : '백 차례입니다.');
  }

  updateStatus();
  return true;
}

/** 무르기 — 마지막 한 수를 되돌린다. */
function undoMove() {
  const last = history.pop();
  if (!last) {
    setMessage('되돌릴 수가 없습니다.', 'error');
    return false;
  }

  board[last.r][last.c] = EMPTY;
  const el = stoneEls.get(last.r + ',' + last.c);
  if (el) el.remove();
  stoneEls.delete(last.r + ',' + last.c);

  document.querySelectorAll('.stone.win').forEach(e => e.classList.remove('win'));
  gameOver = false;
  winInfo  = null;
  current  = last.color;

  updateLastMarker();
  updateStatus();
  setMessage(`${last.index}수(${last.color === BLACK ? '흑' : '백'})를 물렀습니다.`);
  return true;
}

/** 새 게임 */
function resetGame() {
  board    = createBoard();
  current  = BLACK;
  history  = [];
  gameOver = false;
  winInfo  = null;

  stoneEls.forEach(el => el.remove());
  stoneEls.clear();
  document.querySelectorAll('.forbidden-mark').forEach(e => e.remove());

  updateStatus();
  setMessage('새 게임을 시작합니다. 흑 차례입니다.');
}

/* ── 입력 ─────────────────────────────────── */
boardEl.addEventListener('click', (e) => {
  const rect = boardEl.getBoundingClientRect();
  const cell = rect.width / SIZE;
  const c = Math.floor((e.clientX - rect.left) / cell);
  const r = Math.floor((e.clientY - rect.top) / cell);
  if (inBounds(r, c)) placeStone(r, c);
});

document.getElementById('btnReset').addEventListener('click', resetGame);
btnUndo.addEventListener('click', undoMove);
document.getElementById('chkNumbers').addEventListener('change', (e) => {
  document.body.classList.toggle('show-numbers', e.target.checked);
});

/* 키보드 단축키: U = 무르기, N = 새 게임 */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'u' || e.key === 'U') undoMove();
  if (e.key === 'n' || e.key === 'N') resetGame();
});

/* ── 테스트 패널 ───────────────────────────── */
document.getElementById('btnTest').addEventListener('click', () => {
  const out = document.getElementById('testOutput');
  const results = runSelfTests();
  const passed = results.filter(r => r.pass).length;
  out.innerHTML =
    results.map(r =>
      `<span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? '✓ PASS' : '✗ FAIL'}</span>  ${r.name}` +
      (r.pass ? '' : `  (기대: ${r.expected} / 실제: ${r.actual})`)
    ).join('\n') +
    `\n\n<span class="${passed === results.length ? 'pass' : 'fail'}">${passed} / ${results.length} 통과</span>`;
});

/* ── 시작 ─────────────────────────────────── */
drawGrid();
resetGame();
</script>

</body>
</html>
