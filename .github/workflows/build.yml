name: Build APK

# Builds a debug APK in the cloud so it can be installed on a phone without a PC.
on:
  push:
    branches:
      - claude/build-reference-z9jmoe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build signed release AAB (for Google Play)
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadowdict-builds
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish builds to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: ShadowDict (latest build)
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          body: |
            자동 빌드 결과물입니다.
            - `app-release.aab` : 구글 플레이 콘솔 업로드용 (내부 테스트)
            - `app-debug.apk` : 직접 설치용 (기기가 사이드로드를 허용할 때)
