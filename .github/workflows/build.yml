name: Build APK

# Builds a debug APK in the cloud so it can be installed on a phone without a PC.
on:
  push:
    branches:
      - claude/build-reference-z9jmoe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowdict-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: ShadowDict (debug build)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            자동 빌드된 디버그 APK입니다. 폰에서 아래 `app-debug.apk`를 눌러 설치하세요.
            (설정에서 "출처를 알 수 없는 앱 설치"를 허용해야 할 수 있습니다.)
